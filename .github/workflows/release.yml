name: Release

# Push a tag like v0.1.0 (or v0.2.0-beta.1 for a pre-release) to build RigScope.exe and attach it to a GitHub
# release with its SHA-256.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # The tag is the version: the app compares it with GitHub's latest release in Settings › Updates.
      # CHANGELOG.md must have a section for it (it becomes the release notes and the app's "What's new").
      - name: Version and notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[?$([regex]::Escape($version))(?=[\]\s])[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no section for $version" }
          $m.Groups[1].Value.Trim() | Set-Content notes.md
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet test -c Release -p:Version=${{ env.VERSION }}
      - run: dotnet publish src/RigScope.App -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}
      - name: Checksum and release body
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/RigScope.exe -Algorithm SHA256).Hash
          "$hash  RigScope.exe" | Set-Content publish/RigScope.exe.sha256
          $notes = Get-Content notes.md -Raw
          @"
          $notes

          ---

          SHA-256 of RigScope.exe: ``$hash``

          The exe isn't code-signed yet, so SmartScreen may warn. Click **More info › Run anyway**, or build from source.
          "@ | Set-Content body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RigScope.exe
            publish/RigScope.exe.sha256
          body_path: body.md
          name: RigScope ${{ env.VERSION }}
          # v0.2.0-beta.1, v0.1.0-alpha.1 … → GitHub pre-release; only beta testers are offered it in the app.
          prerelease: ${{ contains(github.ref_name, '-') }}
